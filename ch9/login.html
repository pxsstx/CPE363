<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
    <form action="" class="w-full max-w-md bg-white rounded-2xl shadow-lg shadow-slate-200/50 p-8 flex flex-col gap-6">
        <h2 class="text-2xl font-bold text-slate-800 text-center">Login</h2>
        <div class="flex flex-col gap-2">
            <label for="username" class="text-sm font-medium text-slate-600">Username</label>
            <input type="text" name="username" id="username" placeholder="Enter your username"
                class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition">
        </div>
        <div class="flex flex-col gap-2">
            <label for="password" class="text-sm font-medium text-slate-600">Password</label>
            <input type="password" name="password" id="password" placeholder="Enter your password"
                class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition">
        </div>
        <div class="flex flex-col gap-2">
            <label for="confirm_password" class="text-sm font-medium text-slate-600">Confirm Password</label>
            <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirm your password"
                class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition">
        </div>
        <button type="submit"
            class="w-full mt-2 py-3 rounded-lg bg-blue-500 text-white font-semibold hover:bg-blue-600 focus:ring-2 focus:ring-blue-200 focus:ring-offset-2 transition">
            Login
        </button>
    </form>
    <script>
        const form = document.querySelector("form");
        form.addEventListener("submit", function (e) {
            e.preventDefault();
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const confirm_password = document.getElementById("confirm_password").value;
            if (!username || !password || !confirm_password) {
                alert("Please fill in all fields");
            }
            else if (password !== confirm_password) {
                alert("Password and Confirm Password do not match");
            }
            else {
                alert("Login successful");
            }
        });
    </script>
</body>

</html>
