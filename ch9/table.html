<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <script>
        window.onload = function () {
            let tr = document.querySelectorAll('tr');
            for (row of tr) {
                row.addEventListener("mouseover", function () {
                    this.style.backgroundColor = "powderblue";
                });
                row.addEventListener("mouseout", function () {
                    this.style.backgroundColor = "inherit";
                });

            }
        };
    </script>
</head>

<body>
    <table border="1">
        <tr>
            <td>..1..</td>
            <td>HTML</td>
            <td>ภาษาในการกำหนดเนื้อหา</td>
        </tr>
        <tr>
            <td>..2..</td>
            <td>CSS</td>
            <td>ภาษาในการกำหนดลักษณะของเว็บไซต์</td>
        </tr>
        <tr>
            <td>..3..</td>
            <td>JavaScript</td>
            <td>ภาษาในการกำหนดการทำงานของเว็บไซต์</td>
        </tr>
        <tr>
            <td>..4..</td>
            <td>Node.js</td>
            <td>ภาษาในการควบคุมเซิร์ฟเวอร์</td>
        </tr>
    </table>
</body>

</html>
